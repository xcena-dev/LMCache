// LMCache-driven transfer wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

message RegisterKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
  string engine_type = 5;
  bytes encoded_layout_hints = 6;
  repeated EngineGroupInfo engine_group_infos = 7;
}

message RegisterKvCacheResponse {}

message UnregisterKvCacheRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheResponse {}

message StoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
}

message StoreResponse {
  EventIpcHandleResult result = 1;
}

// Where the server publishes per-slice progress of one layer-major retrieve:
// a slot in the worker's shared-memory arrival board.
message ArrivalBoard {
  string name = 1;
  int64 slot = 2;
  int64 num_slots = 3;
}

// One exported device event handle per model layer.
message LayerEventHandles {
  repeated bytes handles = 1;
}

message RetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
  int64 skip_first_n_tokens = 5;
  // Layer-major retrieve only; absent for a chunk-major retrieve.
  optional ArrivalBoard arrival_board = 6;
  optional LayerEventHandles layer_event_handles = 7;
  int64 layers_per_stage = 8;
}

message RetrieveResponse {
  EventIpcHandleResult result = 1;
}

// One request's block IDs, one list per KV group in kernel order.
message RequestBlockIds {
  repeated BlockIdGroup groups = 1;
}

message ArrivalBoards {
  repeated ArrivalBoard boards = 1;
}

message LayerEventHandleSets {
  repeated LayerEventHandles sets = 1;
}

message RetrieveBatchRequest {
  repeated IpcCacheServerKey keys = 1;
  int64 instance_id = 2;
  repeated RequestBlockIds gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
  int64 skip_first_n_tokens = 5;
  optional ArrivalBoards arrival_boards = 6;
  optional LayerEventHandleSets layer_event_handles = 7;
  int64 layers_per_stage = 8;
}

message RetrieveBatchResult {
  bytes event_ipc_handle = 1;
  repeated bool hits = 2;
}

message RetrieveBatchResponse {
  RetrieveBatchResult result = 1;
}

service LMCacheDrivenService {
  rpc RegisterKvCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc UnregisterKvCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  rpc RetrieveBatch(RetrieveBatchRequest) returns (RetrieveBatchResponse);
}
